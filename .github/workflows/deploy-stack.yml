name: Deploy Multitenant SaaS Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  supabase-db-sync:
    name: Supabase Schema Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Database Schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "Checking Supabase access token format..."
            if [[ "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_ ]]; then
              echo "Linking Supabase project $SUPABASE_PROJECT_ID..."
              supabase link --project-ref "$SUPABASE_PROJECT_ID"
              supabase db push
            else
              echo "SUPABASE_ACCESS_TOKEN is not in sbp_* format. Skipping CLI db push."
            fi
          else
            echo "Supabase secrets not configured, skipping migration."
          fi

  backend-aws-sam-deploy:
    name: AWS SAM Backend Infrastructure Deployment
    runs-on: ubuntu-latest
    needs: supabase-db-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-2' }}

      - uses: aws-actions/setup-sam@v2

      - name: SAM Build and Deploy Stack
        run: |
          sam build
          sam deploy \
            --stack-name context-control-backend \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-image-repos \
            --resolve-s3 \
            --region "${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-2' }}" \
            --parameter-overrides \
              SupabaseUrl="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              SupabaseServiceRoleKey="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

  frontend-aws-amplify-deploy:
    name: AWS Amplify Frontend Deployment & Environment Sync
    runs-on: ubuntu-latest
    needs: backend-aws-sam-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-2' }}

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_MODE: "false"
        run: |
          npm ci
          npm run build

      - name: Sync Environment Variables & Deploy Bundle to AWS Amplify
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-2' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder_for_build' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_placeholder' }}
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID || secrets.AWS_KMS_KEY_ID || 'arn:aws:kms:us-east-2:229198161564:key/f8991972-fa65-4e48-828f-cabdd581685b' }}
          DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_MODE: "false"
          ENABLE_VOICE_CALLS: ${{ vars.ENABLE_VOICE_CALLS || 'false' }}
        run: |
          AMPLIFY_ID="$APP_ID"
          if [ -z "$AMPLIFY_ID" ]; then
            AMPLIFY_ID="d1ct23sivfa3uv"
          fi
          
          echo "1. Updating AWS Amplify environment variables for App ID: $AMPLIFY_ID"
          aws amplify update-app \
            --app-id "$AMPLIFY_ID" \
            --region "$AWS_REGION" \
            --environment-variables \
              "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY,STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET,KMS_KEY_ID=$KMS_KEY_ID,DEMO_MODE=$DEMO_MODE,NEXT_PUBLIC_DEMO_MODE=$NEXT_PUBLIC_DEMO_MODE,ENABLE_VOICE_CALLS=$ENABLE_VOICE_CALLS"

          echo "2. Cancelling any active or pending Amplify jobs..."
          ACTIVE_JOBS=$(aws amplify list-jobs --app-id "$AMPLIFY_ID" --branch-name main --region "$AWS_REGION" --query "jobSummaries[?status=='PENDING' || status=='RUNNING'].jobId" --output text || true)
          if [ -n "$ACTIVE_JOBS" ] && [ "$ACTIVE_JOBS" != "None" ]; then
            for jid in $ACTIVE_JOBS; do
              echo "Stopping pending Amplify job ID: $jid"
              aws amplify stop-job --app-id "$AMPLIFY_ID" --branch-name main --job-id "$jid" --region "$AWS_REGION" || true
            done
          fi

          echo "3. Zipping build deployment package..."
          zip -q -r deploy.zip . -x "node_modules/*" ".git/*" ".aws-sam/*"

          echo "4. Creating AWS Amplify Deployment..."
          DEPLOYMENT_JSON=$(aws amplify create-deployment --app-id "$AMPLIFY_ID" --branch-name main --region "$AWS_REGION")
          JOB_ID=$(echo "$DEPLOYMENT_JSON" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf-8")).jobId)')
          UPLOAD_URL=$(echo "$DEPLOYMENT_JSON" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf-8")).zipUploadUrl)')

          echo "5. Uploading deployment package to Amplify S3 storage (Job ID: $JOB_ID)..."
          curl -H "Content-Type: application/zip" --upload-file deploy.zip "$UPLOAD_URL"

          echo "6. Starting AWS Amplify Deployment for Job ID: $JOB_ID..."
          aws amplify start-deployment --app-id "$AMPLIFY_ID" --branch-name main --job-id "$JOB_ID" --region "$AWS_REGION"
