name: Deploy Multitenant SaaS Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  supabase-db-sync:
    name: Supabase Schema Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Database Schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Deploying app code against an un-migrated schema breaks at runtime, so fail instead of skipping.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID secrets are required to migrate the database."
            exit 1
          fi
          # Tolerate whitespace pasted into the secrets; the CLI validates the token itself.
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')"
          export SUPABASE_PROJECT_ID="$(printf '%s' "$SUPABASE_PROJECT_ID" | tr -d '[:space:]')"
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *) echo "::warning::SUPABASE_ACCESS_TOKEN does not look like a personal access token (sbp_...). Create one under Supabase → Account → Access Tokens if linking fails." ;;
          esac
          echo "Linking Supabase project $SUPABASE_PROJECT_ID..."
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --include-all

  backend-aws-sam-deploy:
    name: AWS SAM Backend Infrastructure Deployment
    runs-on: ubuntu-latest
    needs: supabase-db-sync
    steps:
      - uses: actions/checkout@v4

      - name: Check for Lambda handler
        id: handler
        run: |
          # Dockerfile runs Backend.main.handler; without Backend/main.py the function cannot start.
          if [ -f Backend/main.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend/main.py does not exist; skipping the SAM deploy until a backend handler is added."
          fi

      - uses: actions/setup-python@v5
        if: steps.handler.outputs.present == 'true'
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.handler.outputs.present == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-2' }}

      - uses: aws-actions/setup-sam@v2
        if: steps.handler.outputs.present == 'true'

      - name: SAM Build and Deploy Stack
        if: steps.handler.outputs.present == 'true'
        run: |
          sam build
          sam deploy \
            --stack-name context-control-backend \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-image-repos \
            --resolve-s3 \
            --region "${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-2' }}" \
            --parameter-overrides \
              SupabaseUrl="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              SupabaseServiceRoleKey="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

  frontend-aws-amplify-deploy:
    name: AWS Amplify Frontend Deployment & Environment Sync
    runs-on: ubuntu-latest
    needs: supabase-db-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-2' }}

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_MODE: "false"
        run: |
          npm ci
          npm run build

      - name: Sync Environment Variables & Deploy Bundle to AWS Amplify
        id: amplify
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-2' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder_for_build' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_placeholder' }}
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID || secrets.AWS_KMS_KEY_ID || 'arn:aws:kms:us-east-2:229198161564:key/f8991972-fa65-4e48-828f-cabdd581685b' }}
          DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_MODE: "false"
          ENABLE_VOICE_CALLS: ${{ vars.ENABLE_VOICE_CALLS || 'false' }}
          # Base64-encoded P-256 PKCS#8 PEM; shared by all instances to sign/verify client tokens.
          CLIENT_TOKEN_SIGNING_KEY: ${{ secrets.CLIENT_TOKEN_SIGNING_KEY }}
        run: |
          if [ -z "$CLIENT_TOKEN_SIGNING_KEY" ]; then
            echo "::warning::CLIENT_TOKEN_SIGNING_KEY is not set; client token minting will be disabled in production."
          fi
          AMPLIFY_ID="$APP_ID"
          if [ -z "$AMPLIFY_ID" ]; then
            # multitenant-agent-app (us-east-2); set the AMPLIFY_APP_ID secret to override.
            AMPLIFY_ID="d1iqgqn47ob84d"
          fi

          AMPLIFY_REPOSITORY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          CURRENT_REPOSITORY=$(aws amplify get-app \
            --app-id "$AMPLIFY_ID" \
            --region "$AWS_REGION" \
            --query 'app.repository' \
            --output text)

          # Amplify may store the URL with or without ".git" / a trailing slash; compare normalized.
          normalize_repo() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's#/+$##; s#\.git$##'; }
          if [ "$(normalize_repo "$CURRENT_REPOSITORY")" != "$(normalize_repo "$AMPLIFY_REPOSITORY")" ]; then
            if [ -z "$AMPLIFY_GITHUB_TOKEN" ]; then
              echo "ERROR: Amplify app $AMPLIFY_ID is not connected to $AMPLIFY_REPOSITORY."
              echo "Connect this repository in the Amplify Console or add an AMPLIFY_GITHUB_TOKEN repository secret."
              exit 1
            fi

            echo "Connecting Amplify app to $AMPLIFY_REPOSITORY..."
            aws amplify update-app \
              --app-id "$AMPLIFY_ID" \
              --region "$AWS_REGION" \
              --repository "$AMPLIFY_REPOSITORY" \
              --access-token "$AMPLIFY_GITHUB_TOKEN" >/dev/null
          fi
          
          echo "1. Updating AWS Amplify environment variables for App ID: $AMPLIFY_ID"
          aws amplify update-app \
            --app-id "$AMPLIFY_ID" \
            --region "$AWS_REGION" \
            --environment-variables \
              "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY,STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET,KMS_KEY_ID=$KMS_KEY_ID,DEMO_MODE=$DEMO_MODE,NEXT_PUBLIC_DEMO_MODE=$NEXT_PUBLIC_DEMO_MODE,ENABLE_VOICE_CALLS=$ENABLE_VOICE_CALLS,CLIENT_TOKEN_SIGNING_KEY=$CLIENT_TOKEN_SIGNING_KEY"

          echo "2. Cancelling any active or pending Amplify jobs..."
          ACTIVE_JOBS=$(aws amplify list-jobs --app-id "$AMPLIFY_ID" --branch-name main --region "$AWS_REGION" --query "jobSummaries[?status=='PENDING' || status=='RUNNING'].jobId" --output text || true)
          if [ -n "$ACTIVE_JOBS" ] && [ "$ACTIVE_JOBS" != "None" ]; then
            for jid in $ACTIVE_JOBS; do
              echo "Stopping pending Amplify job ID: $jid"
              aws amplify stop-job --app-id "$AMPLIFY_ID" --branch-name main --job-id "$jid" --region "$AWS_REGION" || true
            done
          fi

          echo "3. Starting AWS Amplify Build Job..."
          JOB_ID=$(aws amplify start-job \
            --app-id "$AMPLIFY_ID" \
            --branch-name main \
            --job-type RELEASE \
            --region "$AWS_REGION" \
            --query 'jobSummary.jobId' \
            --output text)

          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "None" ]; then
            echo "ERROR: Amplify did not return a build job ID."
            exit 1
          fi

          echo "Waiting for Amplify SSR build job $JOB_ID..."
          for attempt in $(seq 1 120); do
            JOB_STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_ID" \
              --branch-name main \
              --job-id "$JOB_ID" \
              --region "$AWS_REGION" \
              --query 'job.summary.status' \
              --output text)

            case "$JOB_STATUS" in
              SUCCEED)
                echo "Amplify SSR build job $JOB_ID succeeded."
                echo "app_url=https://main.${AMPLIFY_ID}.amplifyapp.com" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "ERROR: Amplify SSR build job $JOB_ID finished with status $JOB_STATUS."
                exit 1
                ;;
              *)
                echo "Amplify job status: $JOB_STATUS (attempt $attempt/120)"
                sleep 10
                ;;
            esac
          done

          echo "ERROR: Amplify SSR build job $JOB_ID did not finish within 20 minutes."
          exit 1

      - name: Smoke Test Platform MCP Endpoint
        env:
          APP_URL: ${{ vars.APP_URL || steps.amplify.outputs.app_url }}
          MCP_SMOKE_TEST_KEY: ${{ secrets.MCP_SMOKE_TEST_KEY }}
        run: |
          set -euo pipefail
          ENDPOINT="${APP_URL%/}/api/mcp/platform"
          echo "Checking $ENDPOINT"

          ACCEPT='Accept: application/json, text/event-stream'

          # Stateless Streamable HTTP server: GET has no SSE stream and must answer 405.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$ENDPOINT")
          [ "$STATUS" = "405" ] || { echo "GET returned $STATUS (expected 405)"; exit 1; }

          STATUS=$(curl -s -o /tmp/unauth.json -w '%{http_code}' -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' -H "$ACCEPT" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          [ "$STATUS" = "401" ] || { echo "Unauthenticated POST returned $STATUS (expected 401)"; cat /tmp/unauth.json; exit 1; }

          if [ -n "$MCP_SMOKE_TEST_KEY" ]; then
            RESPONSE=$(curl -sf -X POST "$ENDPOINT" \
              -H 'Content-Type: application/json' -H "$ACCEPT" \
              -H "Authorization: Bearer $MCP_SMOKE_TEST_KEY" \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1"}}}')
            echo "$RESPONSE" | grep -q '"protocolVersion"' || { echo "initialize failed: $RESPONSE"; exit 1; }
            echo "Authenticated initialize succeeded."
          else
            echo "::notice::MCP_SMOKE_TEST_KEY not set; skipped the authenticated initialize check."
          fi
