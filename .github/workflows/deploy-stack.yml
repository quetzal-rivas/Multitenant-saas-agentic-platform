name: Deploy Multitenant SaaS Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  supabase-db-sync:
    name: Supabase Schema Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Database Schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "Linking Supabase project..."
            supabase link --project-ref "$SUPABASE_PROJECT_ID" || true
            supabase db push || true
          else
            echo "Supabase secrets not configured, skipping migration."
          fi

  backend-aws-sam-deploy:
    name: AWS SAM Backend Deployment
    runs-on: ubuntu-latest
    needs: supabase-db-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/amazon-ecr-login@v2

      - name: SAM Build and Deploy
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --resolve-image-repos --region us-east-2


  frontend-aws-amplify-deploy:
    name: AWS Amplify Frontend Deployment
    runs-on: ubuntu-latest
    needs: backend-aws-sam-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build


      - name: Trigger AWS Amplify Release Build
        run: |
          if [ -n "${{ secrets.AMPLIFY_APP_ID }}" ]; then
            echo "Triggering release deployment on AWS Amplify App: ${{ secrets.AMPLIFY_APP_ID }}"
            aws amplify start-job --app-id "${{ secrets.AMPLIFY_APP_ID }}" --branch-name main --job-type RELEASE --region us-east-2 || echo "⚠️ Amplify App ID not found or disconnected. Connect your repo in AWS Amplify Console to generate a live preview URL."
          fi

