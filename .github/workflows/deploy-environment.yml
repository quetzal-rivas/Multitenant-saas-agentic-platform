name: Deploy one environment

# Called by deploy-stack.yml once per environment. Everything for one environment runs in a
# single job, so a protected environment (production) needs exactly one approval.
# Per-environment configuration lives in the GitHub environment of the same name:
#   variables: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_PROJECT_ID, AWS_DEPLOY_ROLE_ARN, AMPLIFY_APP_ID, APP_URL
#   secrets:   NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_DB_PASSWORD,
#              SUPABASE_ACCESS_TOKEN, CLIENT_TOKEN_SIGNING_KEY
#   optional:  SMTP_USER + SMTP_PASSWORD (secrets; SES sign-in emails), SMTP_FROM (variable),
#              GITHUB_LOGIN_CLIENT_ID (variable) + GITHUB_LOGIN_SECRET (secret),
#              GOOGLE_LOGIN_CLIENT_ID (variable) + GOOGLE_LOGIN_SECRET (secret)
# Stripe: production uses STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET (live); staging uses
# STRIPE_TEST_SECRET_KEY / STRIPE_TEST_WEBHOOK_SECRET (test mode). Each environment sets the
# variables STRIPE_PRICE_DEVELOPER and STRIPE_PRICE_PRO. Production also uses GOOGLE_OAUTH_*.

on:
  workflow_call:
    inputs:
      stage:
        description: staging | production
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    # One deploy per environment at a time; a production run waiting for approval never blocks staging.
    concurrency:
      group: deploy-${{ inputs.stage }}
      cancel-in-progress: false
    env:
      STAGE: ${{ inputs.stage }}
      APP_URL: ${{ vars.APP_URL }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ inputs.stage == 'production' && secrets.GOOGLE_OAUTH_CLIENT_ID || '' }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ inputs.stage == 'production' && secrets.GOOGLE_OAUTH_CLIENT_SECRET || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=""
          for v in APP_URL SUPABASE_PROJECT_ID SUPABASE_URL SUPABASE_ACCESS_TOKEN SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "${{ vars.AMPLIFY_APP_ID }}" ] || missing="$missing AMPLIFY_APP_ID"
          [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || missing="$missing AWS_DEPLOY_ROLE_ARN"
          if [ -n "$missing" ]; then echo "ERROR: the $STAGE environment is missing:$missing"; exit 1; fi

      # --- Database ---------------------------------------------------------------------
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Apply database migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --include-all

      - name: Point the heartbeat scheduler and sign-in emails at this environment
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM || 'no-reply@contextcontrol.com.mx' }}
          GITHUB_LOGIN_CLIENT_ID: ${{ vars.GITHUB_LOGIN_CLIENT_ID }}
          GITHUB_LOGIN_SECRET: ${{ secrets.GITHUB_LOGIN_SECRET }}
          GOOGLE_LOGIN_CLIENT_ID: ${{ vars.GOOGLE_LOGIN_CLIENT_ID }}
          GOOGLE_LOGIN_SECRET: ${{ secrets.GOOGLE_LOGIN_SECRET }}
        run: |
          api() { curl -sf -X "$1" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/$2" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$3" >/dev/null; }
          BASE="${APP_URL%/}"
          AMPLIFY_URL="https://main.${{ vars.AMPLIFY_APP_ID }}.amplifyapp.com"
          # pg_cron posts to this URL every minute (the migration seeds the production one).
          case "$BASE" in *"'"*) echo "APP_URL must not contain quotes"; exit 1 ;; esac
          SQL="UPDATE public.platform_settings SET value = '$BASE/api/v1/heartbeats/tick', updated_at = now() WHERE key = 'heartbeat_tick_url'"
          api POST database/query "$(jq -n --arg q "$SQL" '{query: $q}')"
          # Auth settings as code. Each optional part applies only when its configuration exists in
          # the environment; otherwise Supabase keeps what it has.
          CONFIG=$(jq -n --arg u "$BASE" --arg a "$AMPLIFY_URL" '{site_url: $u, uri_allow_list: ($u + "/**," + $a + "/**")}')
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            # Sign-in emails through SES, signed for the domain (infra/cdk EmailDomain).
            CONFIG=$(jq --arg user "$SMTP_USER" --arg pass "$SMTP_PASSWORD" --arg from "$SMTP_FROM" \
              '. + {smtp_host: "email-smtp.us-east-2.amazonaws.com", smtp_port: "587", smtp_user: $user, smtp_pass: $pass,
                    smtp_admin_email: $from, smtp_sender_name: "Context Control", rate_limit_email_sent: 100}' <<< "$CONFIG")
          fi
          if [ -n "$GITHUB_LOGIN_CLIENT_ID" ] && [ -n "$GITHUB_LOGIN_SECRET" ]; then
            CONFIG=$(jq --arg id "$GITHUB_LOGIN_CLIENT_ID" --arg s "$GITHUB_LOGIN_SECRET" \
              '. + {external_github_enabled: true, external_github_client_id: $id, external_github_secret: $s}' <<< "$CONFIG")
          fi
          if [ -n "$GOOGLE_LOGIN_CLIENT_ID" ] && [ -n "$GOOGLE_LOGIN_SECRET" ]; then
            CONFIG=$(jq --arg id "$GOOGLE_LOGIN_CLIENT_ID" --arg s "$GOOGLE_LOGIN_SECRET" \
              '. + {external_google_enabled: true, external_google_client_id: $id, external_google_secret: $s}' <<< "$CONFIG")
          fi
          api PATCH config/auth "$CONFIG"
          echo "Auth settings applied: $(jq -c 'keys' <<< "$CONFIG")"

      # --- Infrastructure and worker ------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Build the agent worker
        run: |
          npm ci
          node scripts/build-agent-worker.mjs

      - name: Deploy infrastructure (CDK)
        working-directory: infra/cdk
        run: |
          npm ci
          npx cdk deploy -c stage="$STAGE" --require-approval never --outputs-file "$RUNNER_TEMP/outputs.json" \
            --parameters "SupabaseUrl=$SUPABASE_URL" \
            --parameters "SupabaseAnonKey=$SUPABASE_ANON_KEY" \
            --parameters "SupabaseServiceRoleKey=$SUPABASE_SERVICE_ROLE_KEY" \
            --parameters "GoogleOAuthClientId=$GOOGLE_OAUTH_CLIENT_ID" \
            --parameters "GoogleOAuthClientSecret=$GOOGLE_OAUTH_CLIENT_SECRET"

      # --- Web app --------------------------------------------------------------------------
      - name: Release the web app (Amplify)
        id: amplify
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          CLIENT_TOKEN_SIGNING_KEY: ${{ secrets.CLIENT_TOKEN_SIGNING_KEY }}
          ENABLE_VOICE_CALLS: ${{ vars.ENABLE_VOICE_CALLS || 'false' }}
          # Live keys only in production; staging uses its own test-mode keys (different names, so it can never inherit live ones).
          STRIPE_SECRET_KEY: ${{ inputs.stage == 'production' && secrets.STRIPE_SECRET_KEY || secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ inputs.stage == 'production' && secrets.STRIPE_WEBHOOK_SECRET || secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_PRICE_DEVELOPER: ${{ vars.STRIPE_PRICE_DEVELOPER }}
          STRIPE_PRICE_PRO: ${{ vars.STRIPE_PRICE_PRO }}
          # Stripe Tax on in this environment (tax added where the Stripe account is registered: Mexico).
          STRIPE_AUTOMATIC_TAX: ${{ vars.STRIPE_AUTOMATIC_TAX || 'false' }}
          # Billing notices through SES. Staging's SES is in the sandbox: it can only email @contextcontrol.com.mx.
          NOTICE_EMAIL_FROM: ${{ inputs.stage == 'production' && 'no-reply@contextcontrol.com.mx' || 'staging-notices@contextcontrol.com.mx' }}
        run: |
          OUT="$RUNNER_TEMP/outputs.json"
          out() { jq -r --arg s "ContextControl-$STAGE" --arg k "$1" '.[$s][$k]' "$OUT"; }
          ENV="NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          ENV="$ENV,KMS_KEY_ID=$(out KmsKeyArn),FUNCTION_EXEC_ROLE_ARN=$(out FunctionExecRoleArn),VOICE_CACHE_BUCKET=$(out VoiceBucket)"
          ENV="$ENV,FUNCTION_DEPLOYER_NAME=cc-function-deployer,AGENT_WORKER_FUNCTION=cc-agent-worker"
          ENV="$ENV,CLIENT_TOKEN_SIGNING_KEY=$CLIENT_TOKEN_SIGNING_KEY,ENABLE_VOICE_CALLS=$ENABLE_VOICE_CALLS,DEMO_MODE=false,NEXT_PUBLIC_DEMO_MODE=false"
          [ -n "$STRIPE_SECRET_KEY" ] && ENV="$ENV,STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET"
          [ -n "$STRIPE_PRICE_DEVELOPER" ] && ENV="$ENV,STRIPE_PRICE_DEVELOPER=$STRIPE_PRICE_DEVELOPER,STRIPE_PRICE_PRO=$STRIPE_PRICE_PRO,STRIPE_AUTOMATIC_TAX=$STRIPE_AUTOMATIC_TAX"
          # Platform capacity: keep in sync with maxConcurrentRuns in infra/cdk/bin/app.ts.
          ENV="$ENV,PLATFORM_MAX_CONCURRENT_RUNS=50"
          [ -n "$NOTICE_EMAIL_FROM" ] && ENV="$ENV,NOTICE_EMAIL_FROM=$NOTICE_EMAIL_FROM,SES_REGION=us-east-2"
          [ -n "$GOOGLE_OAUTH_CLIENT_ID" ] && ENV="$ENV,GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET"
          AMPLIFY_ENV="$ENV" scripts/ci/amplify-release.sh

      - name: Smoke test
        env:
          URL: ${{ steps.amplify.outputs.app_url }}
        run: |
          set -euo pipefail
          check() { STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${@:2}"); [ "$STATUS" = "$1" ] || { echo "${*:2} returned $STATUS (expected $1)"; exit 1; }; }
          check 200 "$URL/login"
          check 307 "$URL/dashboard"
          check 405 "$URL/api/mcp/platform"
          check 401 -X POST "$URL/api/mcp/platform" -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          echo "$STAGE is up at $URL"
