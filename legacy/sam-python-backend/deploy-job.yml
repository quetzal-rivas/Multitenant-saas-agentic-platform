# Removed from .github/workflows/deploy-stack.yml (always skipped: Backend/main.py never existed).
jobs:
  backend-aws-sam-deploy:
    name: AWS SAM Backend Infrastructure Deployment
    runs-on: ubuntu-latest
    needs: supabase-db-sync
    steps:
      - uses: actions/checkout@v4

      - name: Check for Lambda handler
        id: handler
        run: |
          # Dockerfile runs Backend.main.handler; without Backend/main.py the function cannot start.
          if [ -f Backend/main.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend/main.py does not exist; skipping the SAM deploy until a backend handler is added."
          fi

      - uses: actions/setup-python@v5
        if: steps.handler.outputs.present == 'true'
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.handler.outputs.present == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-2' }}

      - uses: aws-actions/setup-sam@v2
        if: steps.handler.outputs.present == 'true'

      - name: SAM Build and Deploy Stack
        if: steps.handler.outputs.present == 'true'
        run: |
          sam build
          sam deploy \
            --stack-name context-control-backend \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-image-repos \
            --resolve-s3 \
            --region "${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-2' }}" \
            --parameter-overrides \
              SupabaseUrl="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              SupabaseServiceRoleKey="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

