name: Deploy Multitenant SaaS Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  supabase-db-sync:
    name: Supabase Schema Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Database Schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "Linking Supabase project..."
            supabase link --project-ref "$SUPABASE_PROJECT_ID" || true
            supabase db push || true
          else
            echo "Supabase secrets not configured, skipping migration."
          fi

  backend-aws-sam-deploy:
    name: AWS SAM Backend Deployment
    runs-on: ubuntu-latest
    needs: supabase-db-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/amazon-ecr-login@v2

      - name: SAM Build and Deploy
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --resolve-image-repos --region us-east-2


  frontend-aws-amplify-deploy:
    name: AWS Amplify Frontend Deployment
    runs-on: ubuntu-latest
    needs: backend-aws-sam-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build


      - name: Deploy to AWS Amplify Hosting
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          AWS_REGION: us-east-2
        run: |
          APP_ID="${{ secrets.AMPLIFY_APP_ID }}"
          if [ -z "$APP_ID" ]; then
            APP_ID="d1ct23sivfa3uv"
          fi
          cd out && zip -r ../out.zip . && cd ..
          python3 -c "
          import json, subprocess, os
          app_id = '${APP_ID}'
          res = subprocess.check_output(['aws', 'amplify', 'create-deployment', '--app-id', app_id, '--branch-name', 'main', '--region', 'us-east-2'])
          data = json.loads(res)
          job_id = data['jobId']
          upload_url = data['zipUploadUrl']
          print(f'Uploading out.zip to Amplify Job {job_id}...')
          subprocess.check_call(['curl', '-s', '-H', 'Content-Type: application/zip', '--upload-file', 'out.zip', upload_url])
          subprocess.check_call(['aws', 'amplify', 'start-deployment', '--app-id', app_id, '--branch-name', 'main', '--job-id', job_id, '--region', 'us-east-2'])
          print(f'Deployment job {job_id} successfully started on AWS Amplify App {app_id}.')
          "

