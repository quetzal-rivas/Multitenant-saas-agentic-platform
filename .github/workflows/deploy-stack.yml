name: Deploy Multitenant SaaS Stack

# Every push to main deploys staging (AWS account 832554215040, Supabase context-control-staging).
# Production (account 975970277865, Supabase context-control-prod) follows only after staging
# passes and the owner approves the "production" environment in GitHub.
# The pipeline for the previous single account is kept in legacy/snippets/deploy-stack-old-account.yml.txt.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  staging:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      stage: staging
    secrets: inherit

  production:
    needs: staging
    uses: ./.github/workflows/deploy-environment.yml
    with:
      stage: production
    secrets: inherit
